name: Pruebas automatizadas - Inventario

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivamathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Verificar Sintaxis
        run: |
          php -l src/validaciones.php
          php -l test/test_validaciones.php

      - name: Ejecutar pruebas
        run: php test/test_validaciones.php